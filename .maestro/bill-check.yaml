# Bill checker reproduces an official EEHC example under the 2026-04 tariff (300 kWh ~ 356 EGP).
appId: com.fynxforge.addady
---
- launchApp
- scrollUntilVisible:
    element: 'راجع فاتورتك'
- tapOn: 'راجع فاتورتك'
- tapOn:
    text: 'الاستهلاك في الفاتورة (ك.و.س)'
- inputText: '300'
- tapOn:
    text: 'المبلغ المطلوب (جنيه)'
- inputText: '356'
- tapOn:
    text: 'شهر الاستهلاك'
- eraseText: 10
- inputText: '2026-05'
- tapOn: 'احسب'
- assertVisible: 'الفاتورة مظبوطة تقريبًا'

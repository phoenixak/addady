# Fresh install -> prepaid home -> first reading with balance -> dashboard shows the run-out card.
appId: com.fynxforge.addady
---
- clearState
- launchApp
- assertVisible: 'بيانات البيت'
- tapOn: 'عداد كارت (مسبق الدفع)'
- tapOn: 'يلا نبدأ'
- assertVisible: 'سجل أول قراية عشان نحسبلك'
- tapOn: 'سجل قراية'
- tapOn:
    text: 'استهلاك الشهر على العداد (ك.و.س)'
- inputText: '88'
- tapOn:
    text: 'الرصيد الحالي (جنيه)'
- inputText: '50'
- tapOn: 'حفظ'
- assertVisible: 'الرصيد هيخلص'
- assertVisible: 'تطبيق غير رسمي، والتقدير مش هو فاتورتك'

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Arabic copy stored in logical order
        run: pnpm check:arabic

      - name: Unit tests (vitest, 100% coverage on pure packages)
        run: pnpm test

      - name: Component tests (jest-expo)
        run: pnpm test:apps

      - name: Build npm package (eg-electricity-tariff)
        run: pnpm --filter eg-electricity-tariff build

      - name: Edge Function validator tests
        run: pnpm test:functions

      - name: Bundle check (expo export, Android)
        run: |
          pnpm --filter @addady/app export:android

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Local throwaway stack: migrations applied from scratch, then the pgTAP suite.
      - run: supabase db start
      - run: supabase test db

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Private-terms check (SANITIZE.md)
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: sh scripts/check-private-terms.sh

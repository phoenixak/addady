# Fresh install -> "مين إنت؟" home with a card meter -> first reading with balance -> run-out card.
appId: com.fynxforge.addady
---
- clearState
- launchApp
- assertVisible: 'مين إنت؟'
- tapOn: 'بيت'
- tapOn: 'التالي'
- tapOn: 'عداد كارت (مسبق الدفع)'
- tapOn: 'التالي'
- tapOn: 'يلا نبدأ'
- assertVisible: 'سجل أول قراية عشان نحسبلك'
- tapOn:
    text: 'سجل قراية'
    index: 0
- tapOn:
    text: 'استهلاك الشهر على العداد (ك.و.س)'
- inputText: '88'
- tapOn:
    text: 'الرصيد الحالي (جنيه)'
- inputText: '50'
- tapOn: 'حفظ'
- assertVisible: 'الرصيد هيخلص حوالي.*'
- scrollUntilVisible:
    element: 'تطبيق غير رسمي، والتقدير مش هو فاتورتك'
